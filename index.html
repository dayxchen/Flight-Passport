<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#185FA5" />
    <script>
      // Applied synchronously, before the stylesheet paints, so a stored
      // dark preference doesn't flash light on first load.
      (function () {
        try {
          var stored = localStorage.getItem("fp-theme");
          if (stored === "dark" || stored === "light") {
            document.documentElement.setAttribute("data-theme", stored);
          }
        } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Flight Passport" />
    <title>Flight Passport</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" />
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body>
    <div class="app">
      <button
        id="theme-toggle"
        type="button"
        class="theme-toggle"
        aria-label="Toggle dark mode"
        aria-pressed="false"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M20.5 14.6c-1.1.4-2.3.6-3.5.6-5.5 0-10-4.5-10-10 0-1.2.2-2.4.6-3.5C4 3.3 1.5 7 1.5 11.3 1.5 17.2 6.3 22 12.2 22c4.3 0 8-2.5 9.7-6.1.2-.4-.2-.9-.6-.7z"
            fill="currentColor"
          />
        </svg>
      </button>

      <section id="view-login" class="screen" aria-label="Sign in" hidden>
        <div class="prompt">
          <h1>Flight Passport</h1>
          <p>Sign in to see your flights</p>
        </div>
        <button id="google-sign-in" class="btn google" type="button">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          Continue with Google
        </button>
        <div class="or-divider" aria-hidden="true"><span>or</span></div>
        <form id="login-form" class="stack">
          <label class="field">
            Email
            <input
              id="login-email"
              name="email"
              type="email"
              inputmode="email"
              enterkeyhint="send"
              autocomplete="email"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
              placeholder="you@example.com"
              required
            />
          </label>
          <button id="email-sign-in" class="btn primary" type="submit">Email me a sign-in link</button>
        </form>
        <p id="login-status" class="status" role="status"></p>
      </section>

      <div id="account-bar" class="account-bar" hidden>
        <button id="sign-out" type="button">Sign out</button>
      </div>

      <nav class="topbar" aria-label="Views" hidden>
        <button class="tab is-active" type="button" data-view="add" aria-selected="true">Add Flight</button>
        <button class="tab" type="button" data-view="list" aria-selected="false">My Flights</button>
        <button class="tab" type="button" data-view="globe" aria-selected="false">Globe</button>
        <button class="tab" type="button" data-view="stats" aria-selected="false">Stats</button>
      </nav>

      <main hidden>
        <section id="view-add" class="screen" aria-label="Add flight">
          <div class="prompt">
            <h1 id="add-title">Add a flight</h1>
            <p id="add-subtitle">Enter the flight number and date</p>
          </div>

          <form id="lookup-form" class="stack">
            <label class="field">
              Flight number
              <input
                id="flight-number"
                name="flightNumber"
                inputmode="text"
                autocomplete="off"
                autocapitalize="characters"
                placeholder="UA123"
                required
              />
            </label>
            <label class="field">
              Date
              <button type="button" id="date-trigger" class="picker-trigger" aria-haspopup="dialog" aria-expanded="false">
                Choose a date
              </button>
              <input id="flight-date" name="flightDate" type="hidden" required />
            </label>
            <div id="calendar" class="picker-panel" hidden role="dialog" aria-label="Choose flight date">
              <div class="cal-header">
                <button type="button" id="cal-prev" class="cal-nav" aria-label="Previous month">‹</button>
                <p id="cal-title" class="cal-title"></p>
                <button type="button" id="cal-next" class="cal-nav" aria-label="Next month">›</button>
              </div>
              <div class="cal-weekdays" aria-hidden="true">
                <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
              </div>
              <div id="cal-days" class="cal-days"></div>
            </div>
            <button id="search-flight" class="btn primary" type="submit" hidden>Search</button>
          </form>

          <p id="lookup-status" class="status" role="status"></p>
          <div id="flight-preview" hidden></div>
        </section>

        <section id="view-list" class="screen" aria-label="My flights" hidden>
          <div class="prompt">
            <h1>My flights</h1>
            <p id="list-count" hidden>0 flights</p>
          </div>
          <p id="list-empty" class="empty">No flights added yet</p>
          <div id="flight-list" class="flight-list"></div>
        </section>

        <section id="view-globe" class="screen" aria-label="Flight globe" hidden>
          <p id="globe-status" class="status"></p>
          <p id="globe-empty" class="empty" hidden>No flights yet — add one to see it on the globe</p>
          <button type="button" id="globe-add-cta" class="btn primary" hidden>Add a flight</button>
          <div id="globe-wrap" class="globe-wrap" hidden>
            <div id="globe-stage" class="globe-stage"></div>
            <div id="globe-detail" class="globe-detail" hidden role="status" aria-live="polite"></div>
          </div>
          <p id="globe-skipped" class="status" hidden></p>
        </section>

        <section id="view-stats" class="screen stats-screen" aria-label="My stats" hidden>
          <div class="prompt">
            <h1>My stats</h1>
            <p>A look back at everywhere you've flown</p>
          </div>
          <p id="stats-empty" class="empty" hidden>No flights yet — add one to see your stats</p>
          <div id="stats-wrap" hidden>
            <div id="stats-grid" class="stats-grid"></div>
            <dl id="stats-highlights" class="stats-highlights"></dl>
          </div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
